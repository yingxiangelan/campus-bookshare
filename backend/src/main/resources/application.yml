server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-bookshare
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_bookshare?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: #your_password
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

# 微信小程序配置
wechat:
  appid: #your_appid
  secret:  #your_secret

# JWT配置
jwt:
  secret: campus_bookshare_secret_key
  expiration: 604800

# 文件上传配置
file:
  upload-path: /data/uploads/
  base-url: http://localhost:8080/api/files/
