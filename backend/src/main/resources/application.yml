# ============================================================
# 校园二手书交易平台 - 配置文件（完整版）
# Campus BookShare - Application Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-bookshare
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_bookshare?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# 微信小程序配置
# ============================================================
wechat:
  appid: wxc188e0b1d67dd808      # 替换为你的AppID
  secret: b28494c88b34410a889846024de1e072    # 替换为你的AppSecret

# ============================================================
# JWT配置
# ============================================================
jwt:
  secret: campus_bookshare_secret_key_2024
  expiration: 604800  # 7天，单位：秒

# ============================================================
# 文件上传配置
# ============================================================
file:
  upload-path: /data/uploads/
  base-url: http://localhost:8080/api/files/

# ============================================================
# ISBN查询服务配置
# 
# 支持多种数据源，按优先级查询：
# 1. OpenLibrary（免费，无需配置）
# 2. Google Books（免费，可选配置API Key提高配额）
# 3. 豆瓣图书（需要申请API权限）
# ============================================================
isbn:
  # Google Books API Key（可选，不配置也能用，但有请求限制）
  # 申请地址：https://console.cloud.google.com/apis/credentials
  google:
    apikey: ""
  
  # 豆瓣图书API Key（需要申请）
  # 注意：豆瓣API已限制公开访问，需要联系豆瓣申请权限
  douban:
    apikey: ""

# ============================================================
# OCR图像识别服务配置
# 
# 用于识别书籍封面图片，提取书名、作者等信息
# 支持多种OCR服务提供商，推荐使用百度OCR（准确率高）
# ============================================================
ocr:
  # 百度OCR配置（推荐）
  # 申请地址：https://ai.baidu.com/tech/ocr
  # 免费额度：通用文字识别 50000次/月
  baidu:
    apikey: ""      # API Key
    secretkey: ""   # Secret Key
  
  # 腾讯OCR配置（备选）
  # 申请地址：https://cloud.tencent.com/product/ocr
  tencent:
    secretid: ""
    secretkey: ""

# ============================================================
# 日志配置
# ============================================================
logging:
  level:
    root: INFO
    com.campus.bookshare: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
